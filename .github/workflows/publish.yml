name: 发布书籍

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  # 绑定 sylway.cloud 之后，把这里改成 https://sylway.cloud
  SITE_URL: https://guqinwen3g-netizen.github.io/notes-to-ascence

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装工具
        run: pip install -q fonttools brotli pillow

      - name: 缓存字体
        uses: actions/cache@v4
        with:
          path: .fontsrc
          key: fontsrc-v1

      - name: 准备字体
        run: bash scripts/fetch_fonts.sh .fontsrc

      - name: 从 Markdown 读取并排版
        run: python scripts/build.py --markdown "book/Notes to Ascence.md" --out _site --fonts .fontsrc

      - name: 随页面保存部署工作流
        run: |
          mkdir -p _site/.github/workflows
          cp .github/workflows/deploy-pages.yml _site/.github/workflows/deploy-pages.yml

      - name: 内容是否有变化
        id: check
        run: |
          new=$(cat _site/hash.txt)
          old=""
          if git fetch -q --depth=1 origin gh-pages 2>/dev/null; then
            old=$(git show FETCH_HEAD:hash.txt 2>/dev/null || true)
          fi
          workflow_unchanged=false
          if git show FETCH_HEAD:.github/workflows/deploy-pages.yml 2>/dev/null | cmp -s - .github/workflows/deploy-pages.yml; then
            workflow_unchanged=true
          fi
          if [ "$new" = "$old" ] && [ "$workflow_unchanged" = true ]; then
            echo "内容没有变化，跳过发布"; echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布
        if: steps.check.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "更新书籍"

      - name: 触发电子书部署
        if: steps.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref gh-pages
