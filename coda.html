<header class="opener"><div class="clabel">尾声</div><h1>一霁千山</h1><div class="rule"></div></header>
<article class="text">
<p class="verse">千山万壑，雨霁日昇，云自出岫。</p>
<p>千山万壑并不是在雨停之后才出现。雨落的时候，它们只是被遮住了。雨霁，天色一点点打开，日光进山谷，云气就从峰间缓缓升起，又缓缓散开。山还在，云也只是顺着自己的方向来去。没有什么在此刻被创造，只是从遮蔽里慢慢显露出来。</p>
</article>
